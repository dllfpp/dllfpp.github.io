{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1>Search Engine</h1>
    <form action="/search" method="get">
        <input type="text" name="query" placeholder="Search..." required>
        <button type="submit">Search</button>
    </form>
    <ul>
        {% for table in tables %}
            <li><a href="/table/{{ table }}">{{ table }}</a></li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
